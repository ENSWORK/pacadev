services:
  sofetelec_odoo:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: sofetelec_odoo
    environment:
      HOST: pacadev_postgres_shared
      POSTGRES_DB: sofetelec
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8077:8069"
    volumes:
      - ./filestore:/var/lib/odoo/filestore
      - ./addons/oca:/mnt/extra-addons/oca:ro
      - ./addons/ens_core:/mnt/extra-addons/ens_core:ro
      - ./addons/custom:/mnt/extra-addons/custom:ro
      - /home/pacadev/pacadev/modules/ens_core-17:/mnt/extra-addons/ens_core_shared:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sofetelec.rule=Host(`sofetelec.pacadev.local`)
      - traefik.http.routers.sofetelec.entrypoints=web
      - traefik.http.services.sofetelec.loadbalancer.server.port=8069
    networks:
      - pacadev-network

networks:
  pacadev-network:
    external: true
