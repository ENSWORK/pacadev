[options]
addons_path = /mnt/extra-addons/custom,/mnt/extra-addons/oca,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_port = 5432
db_user = odoo
db_password = %(DB_PASSWORD)s
db_name = {{ client_slug }}_db
db_filter = ^{{ client_slug }}_db$
admin_passwd = %(ADMIN_PASSWORD)s
log_level = info
logfile = /var/log/odoo/odoo.log
log_handler = :INFO
workers = 0
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
