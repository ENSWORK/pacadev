# PACADEV — dnsmasq wildcard DNS
# Résout *.pacadev.local → IP du serveur PACADEV
# Permet d'accéder à tout nouveau client Odoo via <client>.pacadev.local
# sans modifier /etc/hosts ni aucune configuration DNS.

address=/pacadev.local/192.168.11.20

server=8.8.8.8
server=1.1.1.1

no-resolv
no-hosts
bind-interfaces

log-queries
log-facility=-
