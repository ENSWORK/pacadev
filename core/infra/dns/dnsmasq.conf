# PACADEV — Configuration dnsmasq
# Wildcard : tous les sous-domaines *.pacadev.local pointent sur le serveur.
# (pacadev.local, web/ws/dashboard/grafana/pacadai/<client>.pacadev.local...)
address=/pacadev.local/192.168.11.20

port=53

# Upstream DNS fixes (on ignore /etc/resolv.conf du conteneur)
no-resolv
server=1.1.1.1
server=8.8.8.8

cache-size=1000
log-queries
