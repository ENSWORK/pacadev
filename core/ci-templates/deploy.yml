name: PACADEV Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        required: true
        type: choice
        options: [staging, prod]
      client:
        description: 'Slug client'
        required: true
      tag:
        description: 'Tag à déployer (vide = dernier)'
        required: false

  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      client:
        type: string
        required: true
      tag:
        type: string
        required: false

jobs:
  deploy:
    name: Deploy ${{ inputs.client }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.client }}-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Backup pré-déploiement
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.DEPLOY_HOST }} \
            "pacadev backup create --client ${{ inputs.client }}"

      - name: Deploy module
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ssh ${{ vars.DEPLOY_HOST }} \
            "cd /data/Pacadev && git fetch --tags && git checkout $TAG && \
             pacadev deploy approve \
               --client ${{ inputs.client }} \
               --env ${{ inputs.environment }}"

      - name: Smoke tests
        run: |
          HOST="${{ vars.ODOO_HOST }}"
          for i in 1 2 3 4 5; do
            if curl -sf "http://${HOST}:8069/web/health" > /dev/null; then
              echo "✅ Healthcheck OK"
              break
            fi
            echo "⏳ Tentative $i/5..."
            sleep 10
          done

      - name: Notify on success
        if: success()
        run: |
          echo "🎉 Déploiement ${{ inputs.client }} → ${{ inputs.environment }} réussi"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Échec — déclenchement rollback automatique"
          ssh ${{ vars.DEPLOY_HOST }} \
            "pacadev rollback --client ${{ inputs.client }} --auto" || true
