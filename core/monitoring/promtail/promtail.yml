server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: odoo_logs
    static_configs:
      - targets: [localhost]
        labels:
          job: odoo
          __path__: /home/pacadev/pacadev/v*/clients/*/logs/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+) (?P<pid>\d+) (?P<level>\w+) (?P<db>\S+) (?P<logger>\S+): (?P<message>.*)'
      - labels:
          level:
          db:
          logger:

  - job_name: pacadev_cli
    static_configs:
      - targets: [localhost]
        labels:
          job: pacadev
          __path__: /pacadev-logs/*.log

  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - match:
          selector: '{job="syslog"}'
          stages:
            - regex:
                expression: '^(?P<time>\w+ +\d+ \d+:\d+:\d+) (?P<host>\S+) (?P<process>\S+): (?P<message>.*)'
            - labels:
                host:
                process:
