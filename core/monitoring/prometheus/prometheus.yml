global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'pacadev'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']

  - job_name: 'odoo'
    scrape_interval: 30s
    metrics_path: '/web/health'
    static_configs:
      - targets: ['host.docker.internal:8069']
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):.*'
        target_label: client
        replacement: 'default'
