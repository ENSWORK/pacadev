name: PACADEV Pipeline

on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

# ─────────────────────────────────────────────────────────────
# JOB 1 — LINT  (job id = "lint" requis par branch protection)
# ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install ruff

      - name: Detect ens_core Python files
        id: files
        run: |
          FILES=$(find . -path "*/addons/ens_core/*.py" -o -path "*/addons/ens_core/**/*.py" 2>/dev/null | grep -v __pycache__ | tr '\n' ' ')
          echo "py_files=$FILES" >> $GITHUB_OUTPUT
          XML=$(find . -path "*/addons/ens_core/*.xml" -o -path "*/addons/ens_core/**/*.xml" 2>/dev/null | tr '\n' ' ')
          echo "xml_files=$XML" >> $GITHUB_OUTPUT

      - name: Ruff — style Python
        if: steps.files.outputs.py_files != ''
        run: ruff check ${{ steps.files.outputs.py_files }} --output-format=github --select=E,F,W --ignore=E501

      - name: xmllint — validation XML
        if: steps.files.outputs.xml_files != ''
        run: |
          sudo apt-get install -y libxml2-utils -qq
          for f in ${{ steps.files.outputs.xml_files }}; do
            xmllint --noout "$f" && echo "OK: $f" || exit 1
          done

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — TEST  (job id = "test" requis par branch protection)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Syntax Python (py_compile)
        run: |
          find . -path "*/addons/ens_core/*.py" -o -path "*/addons/ens_core/**/*.py" \
            | grep -v __pycache__ \
            | xargs -I{} python -m py_compile {} \
            && echo "Syntaxe Python OK"

      - name: Vérification manifests (__manifest__.py)
        run: |
          python3 - <<'EOF'
          import ast, glob, sys

          def parse_manifest(path):
              with open(path) as f:
                  content = f.read()
              tree = ast.parse(content)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Expr) and isinstance(node.value, ast.Dict):
                      return ast.literal_eval(node.value)
              raise ValueError("Aucun dict trouvé")

          errors = []
          manifests = glob.glob("**/addons/ens_core/**/__manifest__.py", recursive=True)
          for path in manifests:
              try:
                  manifest = parse_manifest(path)
                  for key in ("name", "version", "depends", "installable"):
                      if key not in manifest:
                          errors.append(f"{path}: clé manquante '{key}'")
                  version = manifest.get("version", "")
                  parts = version.split(".")
                  if len(parts) != 5 or not parts[0].isdigit():
                      errors.append(f"{path}: version invalide '{version}' (attendu VV.X.X.X.X)")
              except Exception as e:
                  errors.append(f"{path}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Manifests OK ({len(manifests)} modules)")
          EOF

      - name: Vérification structure modules ens_core
        run: |
          python3 - <<'EOF'
          import os, sys, glob
          errors = []
          for manifest in glob.glob("**/addons/ens_core/**/__manifest__.py", recursive=True):
              module_dir = os.path.dirname(manifest)
              if not os.path.exists(os.path.join(module_dir, "__init__.py")):
                  errors.append(f"{module_dir}: __init__.py manquant")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Structure modules OK")
          EOF

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — SECURITY
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Bandit — analyse sécurité Python
        run: |
          FILES=$(find . -path "*/addons/ens_core/*.py" -o -path "*/addons/ens_core/**/*.py" 2>/dev/null | grep -v __pycache__)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs bandit -ll -q --exit-zero
          else
            echo "Aucun fichier Python ens_core à analyser"
          fi

      - name: Détection secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # JOB 4 — AI-RISK
  # ─────────────────────────────────────────────────────────────
  ai-risk:
    name: AI Risk
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcul score de risque IA
        id: risk
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          AI_COMMITS=$(git log $BASE..$HEAD --format="%B" | grep -c "Co-Authored-By: Claude" || true)
          INSERTIONS=$(git diff --stat $BASE..$HEAD | tail -1 | grep -oP '\d+(?= insertion)' || echo 0)
          DELETIONS=$(git diff --stat $BASE..$HEAD | tail -1 | grep -oP '\d+(?= deletion)' || echo 0)
          FILES_CHANGED=$(git diff --name-only $BASE..$HEAD | wc -l)
          PY_CHANGED=$(git diff --name-only $BASE..$HEAD | grep -c '\.py$' || true)
          XML_CHANGED=$(git diff --name-only $BASE..$HEAD | grep -c '\.xml$' || true)

          # Scoring : 0 (faible) → 10 (critique)
          SCORE=0
          [ "$AI_COMMITS" -gt 0 ] && SCORE=$((SCORE + 2))
          [ "$AI_COMMITS" -gt 3 ] && SCORE=$((SCORE + 1))
          [ "$INSERTIONS" -gt 300 ] && SCORE=$((SCORE + 2))
          [ "$INSERTIONS" -gt 1000 ] && SCORE=$((SCORE + 2))
          [ "$PY_CHANGED" -gt 5 ] && SCORE=$((SCORE + 1))
          [ "$FILES_CHANGED" -gt 20 ] && SCORE=$((SCORE + 1))

          if [ "$SCORE" -le 3 ]; then LEVEL="🟢 Faible"
          elif [ "$SCORE" -le 6 ]; then LEVEL="🟡 Moyen"
          else LEVEL="🔴 Élevé"; fi

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "ai_commits=$AI_COMMITS" >> $GITHUB_OUTPUT
          echo "insertions=$INSERTIONS" >> $GITHUB_OUTPUT
          echo "files=$FILES_CHANGED" >> $GITHUB_OUTPUT

      - name: Rapport de risque
        run: |
          {
            echo "## 🤖 AI Risk Assessment"
            echo "| Indicateur | Valeur |"
            echo "|---|---|"
            echo "| Commits IA | ${{ steps.risk.outputs.ai_commits }} |"
            echo "| Lignes ajoutées | ${{ steps.risk.outputs.insertions }} |"
            echo "| Fichiers modifiés | ${{ steps.risk.outputs.files }} |"
            echo "| **Score** | **${{ steps.risk.outputs.score }}/10** |"
            echo "| **Niveau** | **${{ steps.risk.outputs.level }}** |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Bloquer si risque élevé
        if: steps.risk.outputs.score >= 8
        run: |
          echo "Score IA ${{ steps.risk.outputs.score }}/10 — revue manuelle obligatoire avant merge"
          exit 1

  # ─────────────────────────────────────────────────────────────
  # RÉSUMÉ
  # ─────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, ai-risk]
    if: always()
    steps:
      - name: Résumé
        run: |
          echo "lint    : ${{ needs.lint.result }}"
          echo "test    : ${{ needs.test.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "ai-risk : ${{ needs.ai-risk.result }}"
          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.security.result }}" == "failure" || \
                "${{ needs.ai-risk.result }}" == "failure" ]]; then
            echo "❌ Pipeline échoué"
            exit 1
          fi
          echo "✅ Pipeline OK — prêt pour test manuel"
