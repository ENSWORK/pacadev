name: PACADEV Pipeline

on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

# ─────────────────────────────────────────────────────────────
# JOB 1 — LINT
# ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install ruff

      - name: Ruff — style Python (v17/ens_core + modules partagés)
        run: |
          FILES=$(find v17/clients -path "*/addons/ens_core/*.py" -o \
                                   -path "*/addons/ens_core/**/*.py" 2>/dev/null \
                  | grep -v __pycache__)
          FILES="$FILES $(find modules/ens_core-17 -name '*.py' 2>/dev/null \
                  | grep -v __pycache__ | tr '\n' ' ')"
          if [ -n "$FILES" ]; then
            ruff check $FILES --output-format=github --select=E,F,W --ignore=E501
          else
            echo "Aucun fichier Python à analyser"
          fi

      - name: xmllint — validation XML (v17/ens_core + modules partagés)
        run: |
          sudo apt-get install -y libxml2-utils -qq
          FILES=$(find v17/clients -path "*/addons/ens_core/*.xml" -o \
                                   -path "*/addons/ens_core/**/*.xml" 2>/dev/null)
          FILES="$FILES $(find modules/ens_core-17 -name '*.xml' 2>/dev/null)"
          if [ -n "$FILES" ]; then
            echo "$FILES" | while read f; do
              xmllint --noout "$f" && echo "OK: $f" || exit 1
            done
          else
            echo "Aucun fichier XML à analyser"
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — TEST
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Syntax Python (py_compile — v17/ens_core + modules partagés)
        run: |
          FILES=$(find v17/clients -path "*/addons/ens_core/*.py" -o \
                                   -path "*/addons/ens_core/**/*.py" 2>/dev/null \
                  | grep -v __pycache__)
          FILES="$FILES $(find modules/ens_core-17 -name '*.py' 2>/dev/null \
                  | grep -v __pycache__)"
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs -I{} python -m py_compile {} && echo "Syntaxe Python OK"
          else
            echo "Aucun fichier Python à analyser"
          fi

      - name: Vérification manifests (v17/ens_core)
        run: |
          python3 - <<'EOF'
          import ast, glob, sys

          def parse_manifest(path):
              with open(path) as f:
                  content = f.read()
              tree = ast.parse(content)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Expr) and isinstance(node.value, ast.Dict):
                      return ast.literal_eval(node.value)
              raise ValueError("Aucun dict trouvé")

          errors = []
          manifests = glob.glob("v17/clients/*/addons/ens_core/**/__manifest__.py", recursive=True)
          for path in manifests:
              try:
                  manifest = parse_manifest(path)
                  for key in ("name", "version", "depends", "installable"):
                      if key not in manifest:
                          errors.append(f"{path}: clé manquante '{key}'")
                  version = manifest.get("version", "")
                  parts = version.split(".")
                  if len(parts) != 5 or parts[0] != "17":
                      errors.append(f"{path}: version invalide '{version}' (attendu 17.X.X.X.X)")
              except Exception as e:
                  errors.append(f"{path}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Manifests OK ({len(manifests)} modules)")
          EOF

      - name: Structure modules ens_core (v17)
        run: |
          python3 - <<'EOF'
          import os, sys, glob
          errors = []
          for manifest in glob.glob("v17/clients/*/addons/ens_core/**/__manifest__.py", recursive=True):
              module_dir = os.path.dirname(manifest)
              if not os.path.exists(os.path.join(module_dir, "__init__.py")):
                  errors.append(f"{module_dir}: __init__.py manquant")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Structure modules OK")
          EOF

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — SECURITY
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Bandit — analyse sécurité Python (v17/ens_core + modules partagés)
        run: |
          FILES=$(find v17/clients -path "*/addons/ens_core/*.py" -o \
                                   -path "*/addons/ens_core/**/*.py" 2>/dev/null \
                  | grep -v __pycache__)
          FILES="$FILES $(find modules/ens_core-17 -name '*.py' 2>/dev/null \
                  | grep -v __pycache__)"
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs bandit -ll -q --exit-zero
          else
            echo "Aucun fichier Python à analyser"
          fi

      - name: Gitleaks — détection secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact \
            --log-opts "origin/main..HEAD" || \
          gitleaks detect --source . --no-banner --redact --no-git

  # ─────────────────────────────────────────────────────────────
  # JOB 4 — AI-RISK (uniquement sur PR)
  # ─────────────────────────────────────────────────────────────
  ai-risk:
    name: AI Risk
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcul score de risque IA
        id: risk
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          AI_COMMITS=$(git log $BASE..$HEAD --format="%B" | grep -c "Co-Authored-By: Claude" || true)
          INSERTIONS=$(git diff --stat $BASE..$HEAD | tail -1 | grep -oP '\d+(?= insertion)' || echo 0)
          FILES_CHANGED=$(git diff --name-only $BASE..$HEAD | wc -l)
          PY_CHANGED=$(git diff --name-only $BASE..$HEAD | grep -c '\.py$' || true)

          SCORE=0
          [ "$AI_COMMITS" -gt 0 ] && SCORE=$((SCORE + 2))
          [ "$AI_COMMITS" -gt 3 ] && SCORE=$((SCORE + 1))
          [ "$INSERTIONS" -gt 300 ] && SCORE=$((SCORE + 2))
          [ "$INSERTIONS" -gt 1000 ] && SCORE=$((SCORE + 2))
          [ "$PY_CHANGED" -gt 5 ] && SCORE=$((SCORE + 1))
          [ "$FILES_CHANGED" -gt 20 ] && SCORE=$((SCORE + 1))

          if [ "$SCORE" -le 3 ]; then LEVEL="Faible"
          elif [ "$SCORE" -le 6 ]; then LEVEL="Moyen"
          else LEVEL="Eleve"; fi

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "ai_commits=$AI_COMMITS" >> $GITHUB_OUTPUT
          echo "insertions=$INSERTIONS" >> $GITHUB_OUTPUT
          echo "files=$FILES_CHANGED" >> $GITHUB_OUTPUT

      - name: Rapport de risque
        run: |
          {
            echo "## AI Risk Assessment"
            echo "| Indicateur | Valeur |"
            echo "|---|---|"
            echo "| Commits IA | ${{ steps.risk.outputs.ai_commits }} |"
            echo "| Lignes ajoutees | ${{ steps.risk.outputs.insertions }} |"
            echo "| Fichiers modifies | ${{ steps.risk.outputs.files }} |"
            echo "| Score | ${{ steps.risk.outputs.score }}/10 |"
            echo "| Niveau | ${{ steps.risk.outputs.level }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Bloquer si risque eleve
        if: steps.risk.outputs.score >= 8
        run: |
          echo "Score IA ${{ steps.risk.outputs.score }}/10 — revue manuelle obligatoire"
          exit 1

  # ─────────────────────────────────────────────────────────────
  # RÉSUMÉ
  # ─────────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, ai-risk]
    if: always()
    steps:
      - name: Résumé
        run: |
          echo "lint    : ${{ needs.lint.result }}"
          echo "test    : ${{ needs.test.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "ai-risk : ${{ needs.ai-risk.result }}"
          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.security.result }}" == "failure" || \
                "${{ needs.ai-risk.result }}" == "failure" ]]; then
            echo "Pipeline echoue"
            exit 1
          fi
          echo "Pipeline OK — pret pour test manuel"
